services:
    db:
      image: postgres:18
      container_name: olist-postgres
      environment:
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: ${POSTGRES_DB}
      ports:
        - "${POSTGRES_PORT}:5432"
      volumes:
        - olist_pgdata:/var/lib/postgresql

      restart: unless-stopped

volumes:
    olist_pgdata: